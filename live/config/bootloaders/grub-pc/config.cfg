set default=0

# Police du menu : le thème demande « Unifont Regular 16 », fournie par unicode.pf2.
# En UEFI, $prefix pointe vers l'image mémoire de GRUB, qui ne contient pas la
# police (« unicode.pf2 not found », menu vide) : on la charge d'abord depuis
# l'ISO, par un chemin absolu.
if [ -e /boot/grub/unicode.pf2 ] ; then
    font=/boot/grub/unicode.pf2
elif [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

# Copied from the netinst image
if loadfont $font ; then
    set gfxmode=800x600
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm

# Fond indigo de la console (messages « Loading Linux… »), au lieu du noir
if [ -e /boot/grub/splash.png ]; then
    insmod gfxterm_background
    background_color 35,50,94
fi

insmod play
play 960 440 1 0 4 440 1
